<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shell -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Terminal Prompt Symbol: > -->
  <path d="M7 10 L13 16 L7 22" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Cursor Symbol: _ -->
  <line x1="16" y1="22" x2="25" y2="22" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
</svg>
